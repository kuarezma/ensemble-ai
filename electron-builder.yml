appId: com.ensemble.app
productName: Ensemble
directories:
  output: release
  buildResources: build
icon: build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
publish:
  provider: github
  owner: kuarezma
  repo: ensemble-ai
files:
  - out/**/*
  - bin/**/*
  - dist/core/**/*
  - catalog/**/*
  - package.json
mac:
  icon: build/icon.png
  artifactName: Ensemble-${version}-macOS-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  icon: build/icon.png
  artifactName: Ensemble-${version}-Windows-Setup.${ext}
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  artifactName: Ensemble-${version}-Linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Ensemble contributors
  syncDesktopName: true
  category: Development
  executableName: ensemble
  desktop:
    entry:
      Name: Ensemble
      Comment: Reviewable, reversible AI model delegation
      StartupWMClass: ensemble
      Keywords: AI;Development;Productivity;
nsis:
  artifactName: Ensemble-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
